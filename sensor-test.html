<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cap · iPhone sensor test</title><link rel="stylesheet" href="/style.css?v=9"><script src="/sensors.js?v=9" defer></script><script src="/sensor-test.js?v=9" defer></script></head><body><main><h1>Phone sensor test</h1><p>This reads only the iPhone. It does not connect to the cap or send readings to the computer.</p><p>Tap a test, allow motion access, then tip the phone. Event counts and raw values should change.</p><div class="setup-actions"><button id="testBoth" class="primary">Test both sensors</button><button id="testMotion" class="secondary">Motion only</button><button id="testOrientation" class="secondary">Orientation only</button></div><p id="sensorMessage" role="status">No cap connection is needed.</p><pre id="sensorReport" class="sensor-report" aria-live="off"></pre><button id="copySensorReport" class="secondary">Copy sensor report</button><p><a href="/" id="backController">Back to controller</a></p></main></body></html>
